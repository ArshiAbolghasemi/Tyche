# vLLM servers for mistral_7b_instruct and llama2_13b_chat.
#
# Usage:
#   docker compose -f docker-compose.sentiment-llms.yml up -d mistral
#   docker compose -f docker-compose.sentiment-llms.yml up -d llama2
#   docker compose -f docker-compose.sentiment-llms.yml up -d
#   docker compose -f docker-compose.sentiment-llms.yml logs -f
#   docker compose -f docker-compose.sentiment-llms.yml down
#
# Tyche configuration:
#   TYCHE_SENTIMENT_MISTRAL_BASE_URL=http://localhost:8001/v1
#   TYCHE_SENTIMENT_MISTRAL_MODEL=mistral-7b-instruct
#
#   TYCHE_SENTIMENT_LLAMA2_BASE_URL=http://localhost:8002/v1
#   TYCHE_SENTIMENT_LLAMA2_MODEL=llama2-13b-chat
#
# Structured output:
# Current vLLM versions support JSON-schema structured output through the
# OpenAI-compatible request API. The removed
# --guided-decoding-backend=outlines option is not needed.

services:
  mistral:
    image: vllm/vllm-openai:latest
    container_name: tyche-sentiment-mistral

    ports:
      - "8001:8000"

    volumes:
      - hf-cache:/root/.cache/huggingface
      # Chat templates: the AWQ repos ship tokenizers with no chat_template, and
      # transformers >= 4.44 refuses to fall back to a default one — without this
      # every /v1/chat/completions request 400s.
      - ./docker/chat-templates:/chat-templates:ro

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

    # The vllm-openai image already uses `vllm serve` as its entrypoint.
    # Therefore, the model is passed as the first positional argument.
    command:
      - "${MISTRAL_MODEL:-TheBloke/Mistral-7B-Instruct-v0.2-AWQ}"
      - "--served-model-name=mistral-7b-instruct"
      - "--chat-template=/chat-templates/mistral-instruct.jinja"
      - "--quantization=awq"
      - "--dtype=bfloat16"
      - "--gpu-memory-utilization=${MISTRAL_GPU_MEMORY_UTILIZATION:-0.45}"
      - "--max-num-seqs=32"
      - "--max-model-len=8192"
      - "--host=0.0.0.0"
      - "--port=8000"
      # Prevent the JSON-schema decoder from repeatedly emitting legal whitespace
      # instead of the next required token (notably after a JSON property name).
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${MISTRAL_GPU_DEVICE:-0}"
              capabilities:
                - gpu

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >
          import urllib.request as u;
          u.urlopen("http://localhost:8000/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  llama2:
    image: vllm/vllm-openai:latest
    container_name: tyche-sentiment-llama2

    ports:
      - "8002:8000"

    volumes:
      - hf-cache:/root/.cache/huggingface
      # Chat templates: the AWQ repos ship tokenizers with no chat_template, and
      # transformers >= 4.44 refuses to fall back to a default one — without this
      # every /v1/chat/completions request 400s.
      - ./docker/chat-templates:/chat-templates:ro

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

    command:
      - "${LLAMA2_MODEL:-TheBloke/Llama-2-13B-chat-AWQ}"
      - "--served-model-name=llama2-13b-chat"
      - "--chat-template=/chat-templates/llama-2-chat.jinja"
      - "--quantization=awq"
      - "--dtype=bfloat16"
      - "--gpu-memory-utilization=${LLAMA2_GPU_MEMORY_UTILIZATION:-0.45}"
      - "--max-num-seqs=32"
      - "--max-model-len=4096"
      - "--host=0.0.0.0"
      - "--port=8000"
      # Prevent the JSON-schema decoder from repeatedly emitting legal whitespace
      # instead of the next required token (notably after a JSON property name).
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${LLAMA2_GPU_DEVICE:-0}"
              capabilities:
                - gpu

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >
          import urllib.request as u;
          u.urlopen("http://localhost:8000/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  hf-cache:
